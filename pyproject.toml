[project]
name = "grafy"
version = "0.1.0"
description = "Zestawy zadań z przedmiotu Grafy i ich zastosowania"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphs"]
